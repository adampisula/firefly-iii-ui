services:
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/adampisula/firefly-iii-ui:latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:?Set FRONTEND_PUBLIC_URL}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:?Set BACKEND_PUBLIC_URL}
      BACKEND_INTERNAL_API_URL: ${BACKEND_INTERNAL_API_URL:-http://firefly:8080/api/v1}
      FRONTEND_DATA_DIR: /app/data
    depends_on:
      firefly:
        condition: service_started
    ports:
      - "127.0.0.1:${FRONTEND_HTTP_PORT:-3000}:3000"
    volumes:
      - frontend_appearance:/app/data

  firefly:
    image: ${FIREFLY_IMAGE:-fireflyiii/core:version-6.7.9}
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${FIREFLY_APP_KEY:?Set FIREFLY_APP_KEY}
      APP_URL: ${BACKEND_PUBLIC_URL:?Set BACKEND_PUBLIC_URL}
      SITE_OWNER: ${FIREFLY_SITE_OWNER:-you@example.invalid}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: firefly
      DB_USERNAME: firefly
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FIREFLY_HTTP_PORT:-8081}:8080"
    volumes:
      - firefly_uploads:/var/www/html/storage/upload

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: firefly
      POSTGRES_USER: firefly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  firefly_uploads:
  postgres_data:
  frontend_appearance:
